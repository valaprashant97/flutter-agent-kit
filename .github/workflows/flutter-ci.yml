name: Flutter Agent Kit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed scripts tests

      - name: Run validation suite
        run: |
          dart run scripts/validation/validate-structure.dart
          dart run tests/validation/skill_schema_test.dart
          dart run tests/structure/structure_test.dart
          dart run tests/links/link_validator_test.dart
